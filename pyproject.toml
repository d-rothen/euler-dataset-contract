[project]
name = "euler-dataset-contract"
version = "0.3.0"
description = "Versioned dataset-head contracts and extension validation for the Euler ecosystem"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Daniel Rothenpieler", email = "rothenpielerdaniel@gmail.com" },
]
keywords = [
  "dataset",
  "metadata",
  "schema",
  "validation",
  "machine-learning",
  "computer-vision",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.18",
  "pytest>=7.4",
  "ruff>=0.12",
]

[project.urls]
Homepage = "https://github.com/d-rothen/euler-dataset-contract"
Repository = "https://github.com/d-rothen/euler-dataset-contract"
Issues = "https://github.com/d-rothen/euler-dataset-contract/issues"
Documentation = "https://github.com/d-rothen/euler-dataset-contract#readme"
Changelog = "https://github.com/d-rothen/euler-dataset-contract/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["euler_dataset_contract"]

[tool.hatch.build.targets.sdist]
only-include = [
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "docs",
  "euler_dataset_contract",
  "schemas",
  "scripts",
  "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
